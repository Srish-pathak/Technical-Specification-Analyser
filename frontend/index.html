<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechSpecAnalyser</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
:root{--bg:#080B1A;--bg2:#10162B;--v:#8B5CF6;--b:#3B82F6;--l:#C4B5FD;--tx:#F8FAFC;--mut:#94A3B8;--line:rgba(196,181,253,.16);--glass:rgba(16,22,43,.62);--red:#f87171;--amb:#fbbf24;--blu:#60a5fa;--grn:#4ade80;--r:18px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--l);outline-offset:2px}
/* space background (fixed, GPU transforms only) */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(1000px 600px at 70% 10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(800px 600px at 5% 95%,rgba(59,130,246,.14),transparent 60%),var(--bg)}
.stars{position:absolute;inset:-200px;background-repeat:repeat;will-change:transform}
.s1{background-image:radial-gradient(1px 1px at 20px 30px,#fff9,transparent),radial-gradient(1px 1px at 120px 80px,#fff7,transparent),radial-gradient(1px 1px at 70px 150px,#c4b5fdaa,transparent);background-size:190px 190px;animation:dr1 160s linear infinite}
.s2{background-image:radial-gradient(1.5px 1.5px at 40px 60px,#fffc,transparent),radial-gradient(1.5px 1.5px at 160px 140px,#93c5fdaa,transparent);background-size:290px 270px;animation:dr2 220s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;will-change:transform}
.o1{width:380px;height:380px;background:var(--v);top:8%;left:-6%;animation:orb1 38s ease-in-out infinite alternate}
.o2{width:320px;height:320px;background:var(--b);bottom:4%;right:-4%;animation:orb2 46s ease-in-out infinite alternate}
.pt{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:var(--l);box-shadow:0 0 8px var(--l);left:var(--x);top:var(--y);opacity:0;animation:pt var(--d) ease-in-out var(--dl) infinite;will-change:transform,opacity}
@keyframes dr1{to{transform:translate3d(190px,190px,0)}}@keyframes dr2{to{transform:translate3d(-290px,270px,0)}}
@keyframes orb1{to{transform:translate3d(160px,90px,0) scale(1.15)}}@keyframes orb2{to{transform:translate3d(-140px,-80px,0) scale(1.1)}}
@keyframes pt{0%{opacity:0;transform:translate3d(0,0,0)}25%{opacity:.8}75%{opacity:.6}100%{opacity:0;transform:translate3d(var(--mx),var(--my),0)}}
.calm *,.calm *::before,.calm *::after{animation:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* shell */
#root{position:relative;z-index:1;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 22px;background:rgba(8,11,26,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.logo i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#080B1A 38%,transparent 40%),conic-gradient(var(--v),var(--b),var(--l),var(--v));box-shadow:0 0 14px rgba(139,92,246,.6)}
.tl{display:flex;gap:8px;align-items:center}
.menu{display:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 22px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--v),var(--b));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 24px rgba(139,92,246,.4);transition:transform .2s,box-shadow .2s;animation:glow 5s ease-in-out infinite}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 34px rgba(139,92,246,.65)}
.btn.ghost{background:rgba(196,181,253,.08);box-shadow:0 0 0 1px var(--line) inset;animation:none;color:var(--l)}
.btn.ghost:hover{background:rgba(196,181,253,.16);box-shadow:0 0 0 1px rgba(196,181,253,.4) inset}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 34px rgba(139,92,246,.62)}}
.view{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
/* landing */
.hero{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;max-width:1200px;margin:0 auto;padding:40px 28px 70px;min-height:calc(100vh - 62px)}
.badge{display:inline-block;padding:5px 14px;border-radius:99px;font-size:13px;color:var(--l);background:rgba(139,92,246,.14);border:1px solid var(--line);margin-bottom:20px}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:1.02}
.hero h2{font-size:clamp(20px,2.4vw,27px);color:var(--l);font-weight:500;margin:14px 0 16px;max-width:520px}
.hero p{color:var(--mut);max-width:500px;margin:0 0 28px;font-size:16px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.pw{position:relative;aspect-ratio:1;width:min(100%,520px);justify-self:center;animation:float 11s ease-in-out infinite}
@keyframes float{50%{transform:translate3d(0,-14px,0)}}
.rays{position:absolute;inset:-12%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(196,181,253,.22) 0 2deg,transparent 2deg 14deg);-webkit-mask:radial-gradient(circle,transparent 30%,#000 42%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 42%,transparent 70%);filter:blur(3px);animation:spin 140s linear infinite}
.ring{position:absolute;border-radius:50%;will-change:transform}
.r1{inset:8%;background:conic-gradient(from 0deg,var(--v),var(--b),var(--l),var(--v));-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 61%,#000 63%,#000 70%,transparent 72%);filter:drop-shadow(0 0 16px rgba(139,92,246,.8));animation:spin 28s linear infinite}
.r2{inset:15%;background:conic-gradient(from 90deg,transparent,var(--b),transparent 45%,var(--v),transparent);-webkit-mask:radial-gradient(circle,transparent 66%,#000 68%,#000 71%,transparent 73%);mask:radial-gradient(circle,transparent 66%,#000 68%,#000 71%,transparent 73%);animation:spin 40s linear infinite reverse}
.core{position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#04050f 0 38%,#1a1245 62%,rgba(139,92,246,.55) 82%,transparent 100%);box-shadow:0 0 90px 10px rgba(139,92,246,.4),inset 0 0 60px rgba(59,130,246,.5);animation:pulse 7s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 120px 20px rgba(139,92,246,.55),inset 0 0 70px rgba(59,130,246,.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{position:absolute;inset:var(--i);animation:spin var(--t) linear infinite;will-change:transform}
.orbit b{position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--l);box-shadow:0 0 10px var(--l)}
.feat{max-width:1200px;margin:-30px auto 0;padding:0 28px 80px}
/* app */
.wrap{display:flex}
nav{width:250px;flex:none;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:calc(62px + env(safe-area-inset-top,0px));height:calc(100vh - 62px);overflow:auto;background:rgba(8,11,26,.45);backdrop-filter:blur(10px)}
nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:3px;border-radius:12px;color:var(--mut);transition:background .2s,color .2s,transform .2s}
nav a:hover{background:rgba(196,181,253,.08);color:#fff;transform:translateX(3px)}
nav a.on{color:#fff;background:linear-gradient(90deg,rgba(139,92,246,.32),rgba(59,130,246,.08));box-shadow:inset 0 0 0 1px var(--line),inset 2px 0 var(--l)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-width:0;padding:30px;max-width:1180px}
.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s,border-color .25s,box-shadow .25s}
a.card:hover,.lift:hover{transform:translateY(-4px);border-color:rgba(196,181,253,.4);box-shadow:0 16px 40px rgba(0,0,0,.4),0 0 30px rgba(139,92,246,.18)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.mt{margin-top:18px}.mut{color:var(--mut)}
.ph{margin-bottom:22px}.ph h1{font-size:clamp(24px,3.2vw,32px)}.ph p{margin:6px 0 0;color:var(--mut)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--l);background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(59,130,246,.18));border:1px solid var(--line);margin-bottom:14px}
.card h3{margin-bottom:6px;font-size:17px}.card p{margin:0;color:var(--mut);font-size:14px}
textarea,input[type=text],select{width:100%;background:rgba(8,11,26,.8);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit}
textarea{font:13.5px/1.65 ui-monospace,Consolas,monospace;min-height:260px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,246,.2);outline:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.drop{border:1.5px dashed rgba(196,181,253,.35);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--mut);transition:background .2s,border-color .2s}
.drop.over{background:rgba(139,92,246,.14);border-color:var(--l)}
.sev{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:3px 12px;border-radius:99px;font-size:12.5px;border:1px solid}
.c-r{color:var(--red);border-color:#f8717155;background:#f8717112}.c-a{color:var(--amb);border-color:#fbbf2455;background:#fbbf2412}.c-b{color:var(--blu);border-color:#60a5fa55;background:#60a5fa12}.c-g{color:var(--grn);border-color:#4ade8055;background:#4ade8012}
details{border:1px solid var(--line);border-radius:14px;background:var(--glass);margin-bottom:10px;overflow:hidden}
summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:500}
summary::after{content:"+";color:var(--l);font-size:20px;transition:transform .2s}details[open] summary::after{transform:rotate(45deg)}
details div{padding:0 18px 16px;color:var(--mut);font-size:14px}
.prog{height:6px;border-radius:9px;background:rgba(196,181,253,.12);overflow:hidden;margin-top:14px;display:none}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--b),var(--l));transition:width .3s}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none}
.busy .spin{display:inline-block}
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:10px}
.toast{padding:12px 18px;border-radius:14px;background:rgba(16,22,43,.95);border:1px solid rgba(196,181,253,.35);box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 20px rgba(139,92,246,.25);animation:in .3s ease both;max-width:340px;font-size:14px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.sw input{width:40px;height:22px;accent-color:var(--v)}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px;font-size:14px}
.note{font-size:12px;color:var(--mut);margin-top:28px}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.hero{grid-template-columns:1fr;text-align:left;padding-top:20px}.pw{width:min(80%,400px);order:-1}}
@media(max-width:760px){.menu{display:inline-flex}nav{position:fixed;z-index:40;left:0;top:calc(62px + env(safe-area-inset-top,0px));width:270px;background:#0b1024;transform:translateX(-102%);transition:transform .25s}nav.open{transform:none}main{padding:20px 14px}.g4{grid-template-columns:1fr}.top .hide{display:none}}
@media print{
  body{background:#fff!important;color:#111!important}
  #sky,.top,nav,#mb,#an,#toasts,.cta,select,.btn,textarea,.prog,.no-print,#sm-btn,input[type=file],.filters-bar{display:none!important}
  .wrap,main{margin:0!important;padding:0!important;max-width:100%!important}
  .card,details{background:#fff!important;border:1px solid #ccc!important;color:#111!important;box-shadow:none!important;page-break-inside:avoid}
  details{display:block!important}
  details summary{border-bottom:1px solid #eee!important;color:#111!important}
  details div{display:block!important}
  pre,code{background:#f8f9fa!important;color:#111!important;border:1px solid #ddd!important}
  .chip{border:1px solid #888!important}
  .c-r{background:#fee2e2!important;color:#991b1b!important;border-color:#f87171!important}
  .c-a{background:#fef3c7!important;color:#92400e!important;border-color:#fbbf24!important}
  .c-b{background:#dbeafe!important;color:#1e40af!important;border-color:#60a5fa!important}
  .c-g{background:#dcfce7!important;color:#166534!important;border-color:#4ade80!important}
}
</style>
</head>
<body>
<div id="sky"><div class="stars s1"></div><div class="stars s2"></div><div class="orb o1"></div><div class="orb o2"></div><div id="pts"></div></div>
<div id="root">
 <header class="top">
  <div class="row" style="gap:10px"><button class="btn ghost menu" id="mb" style="padding:7px 12px" aria-label="Menu">Menu</button><a class="logo" href="#home"><img src="/favicon.png" width="28" height="28" style="border-radius:50%;box-shadow:0 0 16px rgba(139,92,246,.85);object-fit:cover;vertical-align:middle;margin-right:8px" alt="Logo">TechSpecAnalyser</a></div>
  <div class="tl"><a class="btn ghost hide" href="#dashboard" style="padding:8px 16px">Dashboard</a></div>
 </header>
 <div id="app"><div id="body"></div></div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
const IC={dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',git:'<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 8v8M18 11c0 4-6 3-12 5"/>',pdf:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/>',hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',rep:'<path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',doc:'<path d="M4 5h16M4 10h10M4 15h16M4 20h8"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;
const NAV=[['dashboard','Dashboard','dash'],['code-analysis','Code Analysis','code'],['github-review','GitHub Repository Review','git'],['pdf-analysis','PDF Analysis','pdf'],['history','Analysis History','hist'],['reports','Generated Reports','rep'],['app-settings','Settings','gear']];
const $=s=>document.querySelector(s);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
const head=(t,s)=>`<div class="ph"><h1>${t}</h1><p>${s}</p></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const legend=`<div class="sev"><span class="chip c-r">Critical</span><span class="chip c-a">Warning</span><span class="chip c-b">Informational</span><span class="chip c-g">Passed</span></div>`;
const SECT=['Syntax Errors','Code Quality','Complexity Analysis','Security Issues','AI Code Review','Suggestions for Improvement'];
const results=(secs,msg)=>`<div id="res-box" class="mt"><div class="row sp" style="margin-bottom:12px"><h3>Results</h3>${legend}</div>${secs.map(s=>`<details><summary>${s}</summary><div>${msg}</div></details>`).join('')}</div>`;
const NOENG='Nothing to show yet. Results from your analysis engine appear here once an analysis has run.';
function runDemo(btn,bar,label){if(btn.classList.contains('busy'))return;btn.classList.add('busy');const p=$(bar);p.style.display='block';const f=p.firstElementChild;f.style.width='0';let n=0;const iv=setInterval(()=>{n+=8+Math.random()*10;f.style.width=Math.min(n,100)+'%';if(n>=100){clearInterval(iv);btn.classList.remove('busy');setTimeout(()=>p.style.display='none',500);toast(label+': this prototype has no analysis engine connected, so no results were generated.')}},260)}
const feats=[['code-analysis','Code Analysis','code','Upload or paste source code to perform intelligent code analysis.'],['github-review','GitHub Repository Review','git','Connect a repository and analyze its code structure and quality.'],['pdf-analysis','PDF Analysis','pdf','Upload technical specification PDFs for analysis.'],['reports','Documentation Generator','doc','Generate structured technical documentation.']];
const cards=()=>feats.map(f=>`<a class="card" href="#${f[0]}"><div class="ic">${ic(f[2])}</div><h3>${f[1]}</h3><p>${f[3]}</p></a>`).join('');
const V={
home:()=>`<section class="hero"><div><span class="badge">AI-Powered Developer Intelligence</span><h1>TechSpecAnalyser</h1><h2>Enter the Universe of Intelligent Code Analysis</h2><p>An AI-powered code intelligence platform that analyzes source code, detects potential issues, reviews GitHub repositories, and generates meaningful technical documentation.</p><div class="cta"><a class="btn" href="#code-analysis">Launch Code Analysis</a><a class="btn ghost" href="#features">Explore Features</a></div></div>
<div class="pw" aria-hidden="true"><div class="rays"></div><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div><div class="orbit" style="--i:4%;--t:22s"><b></b></div><div class="orbit" style="--i:12%;--t:34s;animation-direction:reverse"><b style="background:#93c5fd;box-shadow:0 0 10px #60a5fa"></b></div><div class="orbit" style="--i:0%;--t:50s"><b style="width:4px;height:4px"></b></div></div></section>
<section class="feat" id="features"><div class="grid g4">${cards()}</div></section>`,
dashboard:()=>head('Welcome to Your Code Universe','Explore, analyze, and improve your code with intelligent AI-powered tools.')+`<div id="dash-stats"></div><div class="grid g4">${cards()}</div><div class="card mt"><div class="row sp"><div><h3>Recent activity</h3><p>Your latest analyses will appear here.</p></div><a class="btn" href="#code-analysis">Start an analysis</a></div></div>`,
'code-analysis':()=>head('Code Analysis & AI Reviewer','Paste or upload source code to get senior-engineer review, bug detection, complexity metrics, and refactored code.')+`<div class="card"><div class="row" style="margin-bottom:14px"><select id="lang" style="width:auto;min-width:170px" aria-label="Language">${['Python','JavaScript','TypeScript','Java','C','C++','C#','Go','Rust','PHP'].map(l=>`<option>${l}</option>`).join('')}</select><label class="btn ghost" style="padding:10px 18px;animation:none">Upload file<input id="cf" type="file" hidden accept=".py,.js,.ts,.java,.c,.cpp,.cs,.go,.rs,.php,.txt"></label><button type="button" class="btn ghost" id="sm-btn" style="padding:10px 18px;animation:none">⚡ Load Sample Code</button></div><textarea id="code" placeholder="Paste your code here…" spellcheck="false" aria-label="Source code">import os

def calculate_score(user_query):
    # Security test: eval call
    eval(user_query)
    
    # Complexity test: branch conditions
    total = 0
    for i in range(10):
        if i % 2 == 0:
            total += i * 2
        else:
            total -= i
    return total</textarea><div class="row mt"><button class="btn" id="an"><span class="spin"></span>Analyze Code</button><span class="mut" id="fn"></span></div><div class="prog" id="pg"><i></i></div></div><div id="res-box" class="mt"><div class="card" style="text-align:center;padding:42px 20px;border:1px dashed var(--line);background:rgba(16,22,43,.45)"><div style="font-size:36px;margin-bottom:12px">🔬</div><h3 style="color:var(--tx);font-size:18px">Code Analysis Results</h3><p class="mut" style="max-width:560px;margin:8px auto 0;font-size:14px;line-height:1.5">No analysis has been performed yet. Paste or upload code above and click <b>"Analyze Code"</b> to generate detailed category findings, security checks, complexity analysis, and AI recommendations.</p></div></div>`,
'github-review':()=>head('GitHub Repository Review','Connect a GitHub repository to inspect architecture, directory structure, multi-tool static findings, and AI review.')+`
<div class="card">
  <div class="row" style="margin-bottom:12px">
    <input type="text" id="url" placeholder="https://github.com/owner/repository" style="flex:2;min-width:240px" aria-label="Repository URL">
    <input type="text" id="gh-branch" placeholder="Branch (e.g. main)" style="flex:1;min-width:140px;max-width:200px" aria-label="Branch">
    <button type="button" class="btn ghost" id="gh-sample" style="padding:10px 16px;animation:none">⚡ Sample Repo</button>
    <button class="btn" id="an"><span class="spin"></span>Analyze Repository</button>

function normalizeSeverity(sev){
  const s = (sev || '').toUpperCase();
  if(s === 'CRITICAL' || s === 'HIGH') return 'CRITICAL';
  if(s === 'WARNING' || s === 'MEDIUM' || s === 'LOW') return 'WARNING';
  if(s === 'INFORMATIONAL' || s === 'INFO') return 'INFORMATIONAL';
  if(s === 'PASSED') return 'PASSED';
  return 'WARNING';
}

function sevChip(sev){
  const s = normalizeSeverity(sev);
  if(s === 'CRITICAL') return '<span class="chip c-r">CRITICAL</span>';
  if(s === 'WARNING') return '<span class="chip c-a">WARNING</span>';
  if(s === 'INFORMATIONAL') return '<span class="chip c-b">INFORMATIONAL</span>';
  return '<span class="chip c-g">PASSED</span>';
}

function enhanceFinding(f, rawCode){
  const ruleId = f.rule_id || f.rule || 'DIAGNOSTIC';
  const db = RULE_DB[ruleId] || {};
  const normSev = normalizeSeverity(f.severity);
  const fixUrl = f.reference || f.ref || (f.recommended_correction && (f.recommended_correction.startsWith('http://') || f.recommended_correction.startsWith('https://')) ? f.recommended_correction : (db.ref || null));
  const desc = f.description || f.explanation || f.message || '';
  
  // Clean, meaningful human-readable title
  let derivedTitle = f.title || db.title;
  if(!derivedTitle){
    if(desc){
      const first = desc.split('.')[0].trim();
      derivedTitle = first.length > 70 ? (first.slice(0, 70) + '...') : (first.endsWith('.') ? first : first + '.');
    } else {
      derivedTitle = ruleId + ' Finding';
    }
  }

  // Exact file path and line number
  const filePath = f.file_path || f.file || (rawCode ? 'snippet.py' : 'unknown');
  const lineNum = f.line_number ?? f.line ?? null;
  const colNum = f.column_number ?? f.col ?? null;

  // Code snippet & fix
  const evidence = f.evidence || f.code || '';
  const fix = f.recommended_correction || f.fix || db.fix || 'Review and refactor code to adhere to standard conventions.';
  const why = f.why || db.why || (normSev === 'CRITICAL' ? 'This represents a critical vulnerability or high-impact defect that can lead to arbitrary execution, denial of service, or runtime failure.' : (normSev === 'WARNING' ? 'This violates reliability or maintainability standards and may introduce edge-case failures, performance bottlenecks, or regressions.' : 'Informational observation regarding code style, complexity, or design conventions.'));

  return {
    severity: normSev,
    rule_id: ruleId,
    category: f.category || 'quality',
    file_path: filePath,
    line_number: lineNum,
    column_number: colNum,
    source: f.source || 'static_analyzer',
    tool: f.tool || f.source || 'static_analyzer',
    title: derivedTitle,
    explanation: desc || db.explanation || 'Diagnostic finding identified during static code analysis.',
    why: why,
    evidence: evidence,
    fix: fix,
    corrected_code: db.code || (fix && !fix.startsWith('http') && fix.includes('\n') ? fix : ''),
    ref: fixUrl
  };
}

function renderAnalysisOutput(data, scrollIntoView = true){
  CURRENT_ANALYSIS_DATA = data;
  let el = $('#res-box');
  if(!el){
    el = document.createElement('div');
    el.id = 'res-box';
    el.className = 'mt';
    const mainCard = $('.card');
    if(mainCard) mainCard.after(el);
    else document.body.appendChild(el);
  }

  const rawFindings = data.findings || [];
  const metrics = data.metrics || {};
  const ai = data.ai || {};
  const rawCode = $('#code') ? $('#code').value : (data.code || '');

  // 1. Map all static findings
  const enhancedFindings = rawFindings.map(f => enhanceFinding(f, rawCode));

  // 2. Synthesize Section A & D: Six Analysis Categories
  // Category 1: Syntax Errors
  const syntaxFindings = enhancedFindings.filter(f => f.category === 'syntax' || f.rule_id.includes('SYN') || f.rule_id.startsWith('ruff:E9') || f.rule_id.startsWith('ruff:F63'));

  // Category 2: Code Quality
  const qualityFindings = enhancedFindings.filter(f => f.category === 'quality' || (f.rule_id.startsWith('ruff:') && !syntaxFindings.includes(f)) || f.rule_id.startsWith('TSA-QLT'));

  // Category 3: Complexity Analysis
  const complexityFindings = enhancedFindings.filter(f => f.category === 'complexity' || f.rule_id.startsWith('TSA-CMP'));
  if (metrics.avg_complexity !== undefined && metrics.avg_complexity !== null) {
    const mi = metrics.maintainability_index_avg ?? 'N/A';
    complexityFindings.unshift({
      severity: metrics.avg_complexity > 10 ? 'WARNING' : 'INFORMATIONAL',
      rule_id: 'RADON-METRICS',
      category: 'complexity',
      file_path: 'snippet.py',
      line_number: null,
      source: 'static_analyzer',
      tool: 'radon',
      title: 'Cyclomatic Complexity & Maintainability Metrics',
      explanation: `Radon static analyzer measured an average cyclomatic complexity of ${metrics.avg_complexity} and a maintainability index of ${mi}/100.`,
      why: 'Functions with high complexity have numerous branching paths, increasing maintenance overhead and making testing difficult.',
      evidence: '',
      fix: 'Keep function cyclomatic complexity under 10 by breaking complex logic into modular helper functions.',
      corrected_code: '',
      ref: 'https://radon.readthedocs.io/en/latest/intro.html#cyclomatic-complexity'
    });
  }

  // Category 4: Security Issues
  const securityFindings = enhancedFindings.filter(f => f.category === 'security' || f.rule_id.startsWith('bandit:') || f.rule_id.startsWith('TSA-SEC'));

  // Category 5: AI Code Review
  const aiReviewFindings = [];
  if (ai.ran) {
    aiReviewFindings.push({
      severity: ai.overall_score && ai.overall_score < 7 ? 'WARNING' : 'INFORMATIONAL',
      rule_id: 'AI-CODE-REVIEW',
      category: 'ai_review',
      file_path: 'snippet.py',
      line_number: null,
      source: 'AI_review',
      tool: 'TechSpecAnalyser AI Engine',
      title: 'Contextual Architecture & Security Assessment',
      explanation: ai.summary || 'Contextual review of code structure, edge cases, and design patterns.',
      why: 'Automated AI analysis checks high-level program intent, naming conventions, and logic beyond static AST checks.',
      evidence: '',
      fix: 'Review architectural recommendations proposed in the AI Review panel.',
      corrected_code: '',
      ref: null
    });
    // Add AI detected bugs if not duplicated
    (ai.bugs || []).forEach((b, idx) => {
      aiReviewFindings.push({
        severity: normalizeSeverity(b.severity),
        rule_id: `AI-BUG-0${idx+1}`,
        category: 'ai_review',
        file_path: 'snippet.py',
        line_number: b.line ? parseInt(b.line.replace(/\D/g, '')) || null : null,
        source: 'AI_review',
        tool: 'TechSpecAnalyser AI Engine',
        title: b.description ? b.description.split('.')[0] + '.' : 'AI Detected Potential Defect',
        explanation: b.description || 'Potential edge-case or logic risk identified by AI model.',
        why: 'Contextual defects can result in unexpected runtime crashes or unhandled exceptions under boundary conditions.',
        evidence: '',
        fix: 'Inspect flagged lines and implement defensive bounds checking.',
        corrected_code: '',
        ref: null
      });
    });
  }

  // Category 6: Suggestions for Improvement
  const suggestionsFindings = [];
  if (ai.improvements && ai.improvements.length) {
    ai.improvements.forEach((imp, idx) => {
      suggestionsFindings.push({
        severity: 'INFORMATIONAL',
        rule_id: `AI-IMP-0${idx+1}`,
        category: 'suggestions',
        file_path: 'snippet.py',
        line_number: null,
        source: 'AI_review',
        tool: 'TechSpecAnalyser AI Engine',
        title: imp.title || 'Architectural Refactoring Suggestion',
        explanation: imp.detail || 'Recommended enhancement to improve readability and maintainability.',
        why: 'Adhering to modern language standards (e.g. PEP 484 type hints) improves long-term codebase health.',
        evidence: '',
        fix: imp.detail || 'Refactor code according to best practice.',
        corrected_code: '',
        ref: null
      });
    });
  }

  // Define Category Bundles (Section A & D)
  const categories = [
    { id: 'syntax', name: '1. Syntax Errors', findings: syntaxFindings },
    { id: 'quality', name: '2. Code Quality', findings: qualityFindings },
    { id: 'complexity', name: '3. Complexity Analysis', findings: complexityFindings },
    { id: 'security', name: '4. Security Issues', findings: securityFindings },
    { id: 'ai_review', name: '5. AI Code Review', findings: aiReviewFindings },
    { id: 'suggestions', name: '6. Suggestions for Improvement', findings: suggestionsFindings }
  ];

  // Global counts for Section G
  const allCategorizedFindings = [
    ...syntaxFindings,
    ...qualityFindings,
    ...complexityFindings,
    ...securityFindings,
    ...aiReviewFindings,
    ...suggestionsFindings
  ];

  const totalFiles = (data.files && data.files.length) ? data.files.length : (metrics.files_analyzed || 1);
  const totalIssues = allCategorizedFindings.length;
  const critCount = allCategorizedFindings.filter(f => f.severity === 'CRITICAL').length;
  const warnCount = allCategorizedFindings.filter(f => f.severity === 'WARNING').length;
  const infoCount = allCategorizedFindings.filter(f => f.severity === 'INFORMATIONAL').length;
  
  // Passed checks: Number of analysis categories that passed without issues
  const passedCategoryCount = categories.filter(c => c.findings.length === 0).length;

  // Code quality score computation (Section G defined methodology)
  const rawScore = 100 - (critCount * 25) - (warnCount * 5) - Math.max(0, ((metrics.avg_complexity || 1) - 2) * 3);
  const overallScore = Math.max(10, Math.min(100, Math.round(rawScore)));
  const scoreColor = overallScore >= 80 ? 'var(--grn)' : (overallScore >= 50 ? 'var(--amb)' : 'var(--red)');

  // Helper to render individual finding card (Section C)
  function renderFindingCard(f){
    return `
      <details class="finding-card" style="background:rgba(8,11,26,.65);border:1px solid rgba(196,181,253,.18);border-radius:10px;margin-bottom:12px;overflow:hidden">
        <summary style="padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div class="row" style="gap:10px;flex-wrap:wrap">
            ${sevChip(f.severity)}
            <b style="color:var(--tx)">${escapeHtml(f.rule_id)}</b>

            <span class="mut" style="font-size:12px">${f.line_number ? 'Line ' + f.line_number : 'Global'} · ${escapeHtml(f.file_path)}</span>

        <div style="padding:14px 18px 18px;border-top:1px solid rgba(196,181,253,.12);font-size:13.5px;line-height:1.6">

          </div>

            <b class="mut" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.6px">Why the Issue Matters:</b>
            <div style="color:var(--tx);margin-top:2px">${escapeHtml(f.why)}</div>
          </div>
          ${f.evidence ? `
          <div style="margin-bottom:10px">
            <b class="mut" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.6px">Original Code Snippet:</b>
            <pre style="background:rgba(0,0,0,.5);border:1px solid rgba(196,181,253,.15);padding:10px;border-radius:6px;margin:4px 0;font-size:12.5px;overflow:auto"><code>${escapeHtml(f.evidence)}</code></pre>

            <b class="mut" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.6px">Suggested Corrective Action:</b>

          </div>
          ${f.corrected_code ? `
          <div style="margin-bottom:10px">
            <div class="row sp" style="margin-bottom:4px">
              <b class="mut" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.6px">Corrected Code Snippet:</b>

            <pre style="background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.2);padding:10px;border-radius:6px;margin:4px 0;font-size:12.5px;color:var(--grn);overflow:auto"><code>${escapeHtml(f.corrected_code)}</code></pre>
          </div>` : ''}
          <div class="row sp" style="margin-top:12px;padding-top:10px;border-top:1px dashed rgba(196,181,253,.12);font-size:12px">
            <div class="mut">Detection Source: <span style="color:var(--tx)">${escapeHtml(f.source)}</span> · Tool: <span style="color:var(--l)">${escapeHtml(f.tool)}</span></div>
            ${f.ref ? `<a href="${f.ref}" target="_blank" rel="noopener noreferrer" style="color:var(--blu);text-decoration:underline">📖 Documentation & Reference</a>` : ''}
          </div>
        </div>
      </details>
    `;
  }

  // Filter application (Section G)
  function matchesFilter(f, catName){
    if(CURRENT_FILTERS.sev !== 'ALL' && f.severity !== CURRENT_FILTERS.sev) return false;
    if(CURRENT_FILTERS.cat !== 'ALL' && !catName.toLowerCase().includes(CURRENT_FILTERS.cat.toLowerCase())) return false;
    if(CURRENT_FILTERS.src !== 'ALL' && f.source !== CURRENT_FILTERS.src) return false;
    return true;
  }

  // Render categories HTML (Section A & D)
  const categoriesHtml = categories.map(cat => {
    // Determine category status indicator (Section A)
    let catStatus = 'PASSED';
    if (cat.findings.some(f => f.severity === 'CRITICAL')) catStatus = 'CRITICAL';
    else if (cat.findings.some(f => f.severity === 'WARNING')) catStatus = 'WARNING';
    else if (cat.findings.some(f => f.severity === 'INFORMATIONAL')) catStatus = 'INFORMATIONAL';

    // Apply active filters
    const displayedFindings = cat.findings.filter(f => matchesFilter(f, cat.name));
    
    // Check if category is hidden by filters
    if (CURRENT_FILTERS.cat !== 'ALL' && !cat.name.toLowerCase().includes(CURRENT_FILTERS.cat.toLowerCase())) {
      return '';
    }
    if (CURRENT_FILTERS.sev !== 'ALL' && CURRENT_FILTERS.sev === 'PASSED' && cat.findings.length > 0) {
      return '';
    }

    let bodyHtml = '';
    if (cat.findings.length === 0) {
      bodyHtml = `
        <div style="padding:14px 18px;background:rgba(74,222,128,.04);border:1px dashed rgba(74,222,128,.2);border-radius:10px;color:var(--grn);font-size:13.5px">

        </div>
      `;
    } else if (displayedFindings.length === 0) {
      bodyHtml = `
        <div class="mut" style="padding:14px 18px;background:rgba(16,22,43,.4);border-radius:10px;font-size:13px">
          No findings match the current filter selection (${CURRENT_FILTERS.sev !== 'ALL' ? CURRENT_FILTERS.sev : ''} ${CURRENT_FILTERS.src !== 'ALL' ? CURRENT_FILTERS.src : ''}).
        </div>
      `;
    } else {
      bodyHtml = displayedFindings.map(renderFindingCard).join('');
    }

    // Append improved code block in Suggestions for Improvement
    if (cat.id === 'suggestions' && ai.improved_code) {
      bodyHtml += `
        <div style="background:rgba(16,22,43,.7);border:1px solid rgba(196,181,253,.25);border-radius:10px;padding:16px;margin-top:14px">
          <div class="row sp" style="margin-bottom:8px">
            <b style="color:var(--l);font-size:14px">✨ Full Refactored & Improved Code Proposal</b>
            <button type="button" class="btn ghost" onclick="copyImprovedCode(this)" style="padding:4px 12px;font-size:12px;animation:none">📋 Copy Complete Code</button>
          </div>
          <p class="mut" style="font-size:12.5px;margin:0 0 10px">Syntactically validated, type-annotated, and security-hardened code version:</p>
          <pre style="background:rgba(0,0,0,.65);border:1px solid rgba(196,181,253,.15);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.5;overflow:auto;max-height:360px"><code id="improved-code-text">${escapeHtml(ai.improved_code)}</code></pre>
        </div>
      `;
    }

    return `
      <details ${cat.findings.length > 0 ? 'open' : ''} style="margin-bottom:14px;border:1px solid rgba(196,181,253,.22);border-radius:12px;overflow:hidden;background:rgba(16,22,43,.75)">
        <summary style="padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(16,22,43,.9)">
          <div class="row" style="gap:10px">
            <b style="font-size:15px;color:var(--tx)">${cat.name}</b>
            <span class="chip" style="font-size:12px;background:rgba(196,181,253,.08);border-color:rgba(196,181,253,.25);color:var(--l)">${cat.findings.length} Finding(s)</span>
          </div>
          <div class="row" style="gap:10px">
            ${sevChip(catStatus)}
          </div>
        </summary>
        <div style="padding:16px 20px 20px">
          ${bodyHtml}
        </div>
      </details>
    `;
  }).join('');

  // Main UI Assembly (Sections A, B, C, D, G, H)
  el.innerHTML = `
    <!-- Results Header & PDF Export (Section G) -->
    <div class="card mt" style="background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(59,130,246,.12));border:1px solid rgba(196,181,253,.3);margin-bottom:18px">
      <div class="row sp" style="align-items:center;margin-bottom:16px">
        <div class="row" style="gap:10px">
          <img src="/favicon.png" width="26" height="26" style="border-radius:50%" alt="Logo">
          <div>
            <h2 style="font-size:22px;margin:0">Code Analysis Results & Quality Report</h2>
            <div class="mut" style="font-size:12.5px;margin-top:2px">TechSpecAnalyser Automated Code Intelligence · Analysis ID: ${escapeHtml(data.analysis_id || 'COMPLETED')}</div>
          </div>
        </div>
        <button type="button" class="btn ghost" onclick="exportAnalysisPDF()" style="padding:8px 16px;animation:none">📄 Export PDF Report</button>
      </div>

      <!-- Summary Metrics Grid (Section G) -->
      <div class="grid g4 mt" style="gap:10px">
        <div style="background:rgba(8,11,26,.6);padding:12px 14px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Files Analysed</small>
          <div style="font-size:24px;font-weight:700;color:var(--tx);margin-top:2px">${totalFiles}</div>
        </div>
        <div style="background:rgba(8,11,26,.6);padding:12px 14px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Total Issues Detected</small>
          <div style="font-size:24px;font-weight:700;color:${totalIssues ? 'var(--red)' : 'var(--grn)'};margin-top:2px">${totalIssues}</div>
        </div>
        <div style="background:rgba(8,11,26,.6);padding:12px 14px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Severity Breakdown</small>
          <div class="row" style="gap:6px;margin-top:6px">
            <span class="chip c-r" style="font-size:11px">Crit: ${critCount}</span>
            <span class="chip c-a" style="font-size:11px">Warn: ${warnCount}</span>
            <span class="chip c-b" style="font-size:11px">Info: ${infoCount}</span>
          </div>
        </div>
        <div style="background:rgba(8,11,26,.6);padding:12px 14px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Quality Score</small>
          <div style="font-size:24px;font-weight:700;color:${scoreColor};margin-top:2px">
            ${overallScore}<span style="font-size:14px;color:var(--mut)">/100</span>
          </div>
        </div>
      </div>

      <div style="font-size:12px;color:var(--mut);margin-top:12px;line-height:1.5">
        ℹ️ <b>Scoring Methodology:</b> Score starts at 100, penalized by 25 pts per Critical security issue, 5 pts per Warning issue, and calibrated against the Radon Maintainability Index (${metrics.maintainability_index_avg ?? 'N/A'}/100). Passed checks: <b>${passedCategoryCount} of 6</b> categories.
      </div>
    </div>

    <!-- Interactive Filters Bar (Section G) -->
    <div class="card mt filters-bar" style="background:rgba(16,22,43,.65);border:1px solid var(--line);margin-bottom:18px;padding:14px 18px">
      <div class="row sp" style="gap:14px;align-items:center">
        <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
          <span style="font-weight:600;font-size:13px;color:var(--l)">Filter By:</span>
          
          <!-- Severity Filter -->
          <select style="width:auto;padding:6px 12px;font-size:12.5px" onchange="setFilter('sev', this.value)" aria-label="Filter Severity">
            <option value="ALL" ${CURRENT_FILTERS.sev === 'ALL' ? 'selected' : ''}>Severity: All</option>
            <option value="CRITICAL" ${CURRENT_FILTERS.sev === 'CRITICAL' ? 'selected' : ''}>Critical (${critCount})</option>
            <option value="WARNING" ${CURRENT_FILTERS.sev === 'WARNING' ? 'selected' : ''}>Warning (${warnCount})</option>
            <option value="INFORMATIONAL" ${CURRENT_FILTERS.sev === 'INFORMATIONAL' ? 'selected' : ''}>Informational (${infoCount})</option>
            <option value="PASSED" ${CURRENT_FILTERS.sev === 'PASSED' ? 'selected' : ''}>Passed Categories (${passedCategoryCount})</option>
          </select>

          <!-- Category Filter -->
          <select style="width:auto;padding:6px 12px;font-size:12.5px" onchange="setFilter('cat', this.value)" aria-label="Filter Category">
            <option value="ALL" ${CURRENT_FILTERS.cat === 'ALL' ? 'selected' : ''}>Category: All (6)</option>
            <option value="Syntax" ${CURRENT_FILTERS.cat === 'Syntax' ? 'selected' : ''}>1. Syntax Errors</option>
            <option value="Quality" ${CURRENT_FILTERS.cat === 'Quality' ? 'selected' : ''}>2. Code Quality</option>
            <option value="Complexity" ${CURRENT_FILTERS.cat === 'Complexity' ? 'selected' : ''}>3. Complexity Analysis</option>
            <option value="Security" ${CURRENT_FILTERS.cat === 'Security' ? 'selected' : ''}>4. Security Issues</option>
            <option value="AI" ${CURRENT_FILTERS.cat === 'AI' ? 'selected' : ''}>5. AI Code Review</option>
            <option value="Suggestions" ${CURRENT_FILTERS.cat === 'Suggestions' ? 'selected' : ''}>6. Suggestions</option>
          </select>

          <!-- Detection Source Filter -->
          <select style="width:auto;padding:6px 12px;font-size:12.5px" onchange="setFilter('src', this.value)" aria-label="Filter Source">
            <option value="ALL" ${CURRENT_FILTERS.src === 'ALL' ? 'selected' : ''}>Source: All</option>
            <option value="static_analyzer" ${CURRENT_FILTERS.src === 'static_analyzer' ? 'selected' : ''}>static_analyzer</option>
            <option value="AI_review" ${CURRENT_FILTERS.src === 'AI_review' ? 'selected' : ''}>AI_review</option>
            <option value="deterministic_rule" ${CURRENT_FILTERS.src === 'deterministic_rule' ? 'selected' : ''}>deterministic_rule</option>
          </select>
        </div>

        <!-- Legend (Section B) -->
        <div class="sev">
          <span class="chip c-r">CRITICAL</span>
          <span class="chip c-a">WARNING</span>
          <span class="chip c-b">INFORMATIONAL</span>
          <span class="chip c-g">PASSED</span>
        </div>
      </div>
    </div>

    <!-- The Six Expandable Analysis Categories (Section A & D) -->
    <div id="categories-container">
      ${categoriesHtml}
    </div>
  `;

  if (scrollIntoView) {
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 100);
  }
}


let LAST_GITHUB_DATA = null;
let GH_FILTERS = { sev: 'ALL', tool: 'ALL' };
let GH_DISPLAY_LIMIT = 30;

function setGhFilter(key, val) {
  GH_FILTERS[key] = val;
  GH_DISPLAY_LIMIT = 30;
  if (LAST_GITHUB_DATA) renderGithubOutput(LAST_GITHUB_DATA, false);
}

function loadMoreGhFindings() {
  GH_DISPLAY_LIMIT += 30;
  if (LAST_GITHUB_DATA) renderGithubOutput(LAST_GITHUB_DATA, false);
}

function filterGhTree(q) {
  const query = (q || '').toLowerCase().trim();
  const items = document.querySelectorAll('.gh-tree-item');
  items.forEach(el => {
    const path = el.getAttribute('data-path') || '';
    if (!query || path.toLowerCase().includes(query)) {
      el.style.display = 'flex';
    } else {
      el.style.display = 'none';
    }
  });
}

function copySnippet(btn, codeId) {
  const el = document.getElementById(codeId);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(() => {
    const prev = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    setTimeout(() => btn.innerHTML = prev, 2000);
    toast('Code snippet copied to clipboard!');
  }).catch(() => toast('Failed to copy.'));
}

function renderGithubOutput(data, scrollIntoView = true) {
  LAST_GITHUB_DATA = data;
  const el = $('#github-results');
  if (!el) return;

  const repo = data.repository || {};
  const tree = data.tree || {};
  const struct = tree.structure || {};
  const metrics = data.metrics || {};
  const rawFindings = data.findings || [];
  const enhancedFindings = rawFindings.map(f => enhanceFinding(f));
  const ai = data.ai || {};
  const suggestions = ai.suggestions || [];

  // Severity counts from enhanced findings
  const critCount = enhancedFindings.filter(f => f.severity === 'CRITICAL').length;
  const warnCount = enhancedFindings.filter(f => f.severity === 'WARNING').length;
  const infoCount = enhancedFindings.filter(f => f.severity === 'INFORMATIONAL').length;

  // Health Score calculation
  const score = metrics.health_score;
  const hasScore = (score !== null && score !== undefined);
  let scoreColor = 'var(--grn)';
  if (hasScore) {
    if (score < 50) scoreColor = 'var(--red)';
    else if (score < 75) scoreColor = 'var(--amb)';
    else if (score < 90) scoreColor = 'var(--blu)';
  } else {
    scoreColor = 'var(--mut)';
  }
  const scoreDisplay = hasScore
    ? `${score}<span style="font-size:14px;color:var(--mut)">/100</span>`
    : `<span style="font-size:15px;color:var(--mut)">Not available</span>`;

  // Languages breakdown (handles both dict and array representations)
  const langs = repo.languages || {};
  let langEntries = [];
  if (Array.isArray(langs)) {
    langEntries = langs.map(l => ({
      name: l.language || l.name,
      bytes: l.bytes || 0,
      pct: l.percentage ? Number(l.percentage).toFixed(1) : '0.0'
    }));
  } else if (typeof langs === 'object' && langs !== null) {
    const totalBytes = Object.values(langs).reduce((a, b) => (typeof b === 'number' ? a + b : a), 0) || 1;
    langEntries = Object.entries(langs).map(([name, bytes]) => ({
      name,
      bytes: typeof bytes === 'number' ? bytes : 0,
      pct: typeof bytes === 'number' ? ((bytes / totalBytes) * 100).toFixed(1) : '0.0'
    })).sort((a, b) => b.bytes - a.bytes);
  }

  const langPalette = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#6366f1'];
  const langBarHtml = langEntries.map((l, i) => `
    <div style="width:${l.pct}%;background:${langPalette[i % langPalette.length]};height:100%" title="${escapeHtml(l.name)}: ${l.pct}%"></div>
  `).join('');

  const createdDate = (repo.created_at && repo.created_at !== 'Not available') ? new Date(repo.created_at).toLocaleDateString() : 'Not available';
  const updatedDate = (repo.updated_at && repo.updated_at !== 'Not available') ? new Date(repo.updated_at).toLocaleDateString() : 'Not available';

  // 1. Repository Information Section
  const repoInfoHtml = `
    <div style="padding:4px 0">
      <div class="row sp" style="align-items:flex-start;margin-bottom:14px">
        <div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h3 style="font-size:18px;margin:0;color:var(--tx)">${escapeHtml(repo.full_name || data.input_name)}</h3>
            <span class="chip ${repo.private ? 'c-a' : 'c-g'}" style="font-size:12px">${repo.private ? '🔒 Private' : '🌐 Public'}</span>
            <span class="chip c-b" style="font-size:12px">Branch: ${escapeHtml(data.branch || repo.default_branch || 'main')}</span>
          </div>
          <p class="mut" style="font-size:13.5px;margin:6px 0 0">${escapeHtml(repo.description || 'Not available')}</p>
        </div>
        <a href="${escapeHtml(repo.html_url || ('https://github.com/' + (repo.full_name || '')))}" target="_blank" rel="noopener" class="btn ghost" style="padding:6px 14px;font-size:12.5px;flex:none;animation:none">View on GitHub ↗</a>
      </div>

      <!-- Stats Grid -->
      <div class="grid g4 mt" style="gap:10px;margin-bottom:16px">
        <div style="background:rgba(8,11,26,.6);padding:12px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Primary Language</small>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px">${escapeHtml(repo.primary_language || 'Not specified')}</div>
        </div>
        <div style="background:rgba(8,11,26,.6);padding:12px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Stars / Forks</small>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px">⭐ ${repo.stars ?? 0} &nbsp; 🍴 ${repo.forks ?? 0}</div>
        </div>
        <div style="background:rgba(8,11,26,.6);padding:12px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">Open Issues / Size</small>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px">🐛 ${repo.open_issues ?? 0} · 💾 ${(repo.size_kb ? (repo.size_kb > 1024 ? (repo.size_kb/1024).toFixed(1) + ' MB' : repo.size_kb + ' KB') : '0 KB')}</div>
        </div>
        <div style="background:rgba(8,11,26,.6);padding:12px;border-radius:10px;border:1px solid var(--line)">
          <small class="mut">License</small>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(repo.license || 'Not available')}</div>
        </div>
      </div>

      <!-- Languages Progress Bar -->
      <div style="margin-top:14px">
        <div class="row sp" style="margin-bottom:6px">
          <small class="mut" style="font-weight:600">Detected Programming Languages</small>
          <small class="mut">${langEntries.length} language(s)</small>
        </div>
        <div style="height:8px;border-radius:6px;overflow:hidden;display:flex;background:rgba(255,255,255,.05);margin-bottom:10px">
          ${langBarHtml || '<div style="width:100%;background:#3b82f6"></div>'}
        </div>
        <div class="row" style="gap:8px 14px;flex-wrap:wrap">
          ${langEntries.map((l, i) => `
            <div style="display:flex;align-items:center;gap:6px;font-size:12.5px">
              <span style="width:9px;height:9px;border-radius:50%;background:${langPalette[i % langPalette.length]}"></span>
              <span style="color:var(--tx);font-weight:500">${escapeHtml(l.name)}</span>
              <span class="mut">${l.pct}%</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div style="font-size:12px;color:var(--mut);margin-top:14px">
        📅 <b>Created:</b> ${createdDate} · 🔄 <b>Last Updated:</b> ${updatedDate}
      </div>
    </div>
  `;

  // 2. File Structure Section
  const entryBadges = (struct.entry_points || []).map(p => `<span class="chip c-b" style="font-family:monospace">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">None detected</span>';
  const frontBadges = (struct.frontend || struct.frontend_files || []).map(p => `<span class="chip c-g" style="font-family:monospace">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">None detected</span>';
  const backBadges = (struct.backend || struct.backend_files || []).map(p => `<span class="chip c-b" style="font-family:monospace">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">None detected</span>';
  const dbBadges = (struct.database || struct.database_files || []).map(p => `<span class="chip c-a" style="font-family:monospace">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">None detected</span>';
  const routeBadges = (struct.routes || struct.api_routes || []).map(p => `<span class="chip c-b" style="font-family:monospace">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">None detected</span>';
  const configBadges = (struct.configs || struct.config_files || []).map(p => `<span class="chip" style="font-family:monospace;background:rgba(196,181,253,.1);border-color:var(--line)">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">None detected</span>';
  const testBadges = (struct.tests || struct.test_files || []).map(p => `<span class="chip c-g" style="font-family:monospace">${escapeHtml(p)}</span>`).join('') || '<span class="mut" style="font-size:12.5px">No test suite detected</span>';

  const paths = tree.paths || [];
  const fileTreeHtml = paths.map(p => {
    const isPy = p.endsWith('.py');

let LAST_PDF_DATA = null;
let PDF_FILTERS = { sev: 'ALL', cat: 'ALL' };

function setPdfFilter(key, val) {
  PDF_FILTERS[key] = val;
  if (LAST_PDF_DATA) renderPdfOutput(LAST_PDF_DATA, false);
}

function filterPdfTraceability(q) {
  const query = (q || '').toLowerCase().trim();
  const rows = document.querySelectorAll('.pdf-trace-card');
  rows.forEach(r => {
    const text = (r.textContent || '').toLowerCase();
    r.style.display = (!query || text.includes(query)) ? '' : 'none';
  });
}

function downloadPdfJsonReport() {
  if (!LAST_PDF_DATA) return toast('No PDF analysis data to download.');
  const jsonStr = JSON.stringify(LAST_PDF_DATA, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = (LAST_PDF_DATA.input_name || 'specification').replace(/\.pdf$/i, '');
  a.download = `${safeName}_analysis_report.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('JSON report downloaded successfully!');
}

function exportPdfAnalysisReport() {
  if (!LAST_PDF_DATA) return toast('No analysis to export.');
  window.print();
}

          return `
            <div style="margin-bottom:12px;background:rgba(8,11,26,.7);border:1px solid rgba(196,181,253,.2);border-radius:10px;padding:14px">
              <div class="row sp" style="align-items:flex-start;margin-bottom:6px">
                <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
                  <span class="chip ${priChip}" style="font-size:11px;font-weight:700">${escapeHtml((r.priority || 'MEDIUM').toUpperCase())}</span>
                  <b style="color:var(--tx);font-size:14px">${escapeHtml(r.title || 'Recommendation')}</b>
                </div>
                <span class="chip c-b" style="font-size:11px">${escapeHtml(r.category || 'Architecture')}</span>
              </div>
              <p class="mut" style="font-size:13px;line-height:1.55;margin:0">${escapeHtml(r.detail || '')}</p>
            </div>
          `;
        }).join('')}
      </div>
    </details>

    <!-- 4. Risk & Severity Analysis -->
    <details open style="margin-bottom:14px;border:1px solid rgba(196,181,253,.22);border-radius:12px;overflow:hidden;background:rgba(16,22,43,.75)">
      <summary style="padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(16,22,43,.9)">
        <div class="row" style="gap:10px">
          <b style="font-size:15px;color:var(--tx)">4. Risk & Severity Analysis</b>
          <span class="chip" style="font-size:12px;background:rgba(196,181,253,.08);border-color:rgba(196,181,253,.25);color:var(--l)">${findings.length} Evaluation(s)</span>
        </div>
        <div class="row" style="gap:8px">
          ${critCount ? '<span class="chip c-r">CRITICAL</span>' : (warnCount ? '<span class="chip c-a">WARNING</span>' : '<span class="chip c-g">PASSED</span>')}
        </div>
      </summary>
      <div style="padding:16px 20px 20px">
        <div class="row sp" style="align-items:center;padding:8px 12px;background:rgba(8,11,26,.6);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:12px;flex-wrap:wrap;gap:8px">
          <div class="row" style="gap:8px;align-items:center">
            <span style="font-weight:600;color:var(--tx)">Filter Severity:</span>
            <select style="width:auto;padding:3px 8px;font-size:11.5px;height:26px" onchange="setPdfFilter('sev', this.value)" aria-label="Filter Severity">
              <option value="ALL" ${PDF_FILTERS.sev === 'ALL' ? 'selected' : ''}>All Severities (${findings.length})</option>
              <option value="Critical" ${PDF_FILTERS.sev === 'Critical' ? 'selected' : ''}>Critical (${critCount})</option>
              <option value="Warning" ${PDF_FILTERS.sev === 'Warning' ? 'selected' : ''}>Warning (${warnCount})</option>
              <option value="Informational" ${PDF_FILTERS.sev === 'Informational' ? 'selected' : ''}>Informational (${infoCount})</option>
              <option value="Passed" ${PDF_FILTERS.sev === 'Passed' ? 'selected' : ''}>Passed (${passCount})</option>
            </select>
          </div>
          <div class="row" style="gap:6px">
            <span class="chip c-r" style="font-size:10px">Crit: ${critCount}</span>
            <span class="chip c-a" style="font-size:10px">Warn: ${warnCount}</span>
            <span class="chip c-b" style="font-size:10px">Info: ${infoCount}</span>
            <span class="chip c-g" style="font-size:10px">Pass: ${passCount}</span>
          </div>
        </div>
        <div>${findingsHtml}</div>
      </div>
    </details>

    <!-- 5. Missing Requirements & Gap Detection -->
    <details open style="margin-bottom:14px;border:1px solid rgba(196,181,253,.22);border-radius:12px;overflow:hidden;background:rgba(16,22,43,.75)">
      <summary style="padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(16,22,43,.9)">
        <div class="row" style="gap:10px">
          <b style="font-size:15px;color:var(--tx)">5. Missing Requirements & Gap Detection</b>
          <span class="chip" style="font-size:12px;background:rgba(196,181,253,.08);border-color:rgba(196,181,253,.25);color:var(--l)">${gaps.length} Gap(s) Identified</span>
        </div>
        <span class="chip ${gaps.length ? 'c-a' : 'c-g'}">${gaps.length ? 'GAPS DETECTED' : 'COMPLETE'}</span>
      </summary>
      <div style="padding:16px 20px 20px">${gapsHtml}</div>
    </details>

    <!-- 6. Requirement Traceability Matrix -->
    <details open style="margin-bottom:14px;border:1px solid rgba(196,181,253,.22);border-radius:12px;overflow:hidden;background:rgba(16,22,43,.75)">
      <summary style="padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(16,22,43,.9)">
        <div class="row" style="gap:10px">
          <b style="font-size:15px;color:var(--tx)">6. Requirement Traceability Matrix</b>
          <span class="chip c-b" style="font-size:12px">${tm.length} Mapped Requirement(s)</span>
        </div>
        <span class="chip c-g">TRACEABLE</span>
      </summary>
      <div style="padding:16px 20px 20px">
        <div class="row sp" style="align-items:center;margin-bottom:12px;gap:10px">
          <input type="text" placeholder="Search requirements, categories, or keywords..." style="padding:6px 12px;font-size:12.5px;flex:1;max-width:380px" oninput="filterPdfTraceability(this.value)">
          <span class="mut" style="font-size:12px">${tm.length} requirement(s) tracked back to source PDF pages</span>
        </div>
        <div>${traceHtml}</div>
      </div>
    </details>
  `;

  if (scrollIntoView) {
    setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 100);
  }
}

function bind(k){
  const an=$('#an');
  if(k=='code-analysis'){
    const smBtn=$('#sm-btn');
    if(smBtn) smBtn.onclick=()=>{
      $('#code').value='import os\n\ndef calculate_score(user_query):\n    # Security test: eval call\n    eval(user_query)\n    \n    # Complexity test: branch conditions\n    total = 0\n    for i in range(10):\n        if i % 2 == 0:\n            total += i * 2\n        else:\n            total -= i\n    return total';
      toast('Sample code loaded!');
    };
    $('#cf').onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{$('#code').value=r.result;$('#fn').textContent=f.name;toast('Loaded '+f.name)};
      r.readAsText(f);
    };
    an.onclick=async ()=>{
      const code=$('#code').value;
      const lang=$('#lang').value.toLowerCase();
      if(!code.trim())return toast('Add some code first.');
      if(an.classList.contains('busy'))return;
      an.classList.add('busy');
      const p=$('#pg');p.style.display='block';p.firstElementChild.style.width='50%';
      try{
        const res=await fetch('/api/analysis/code',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({code,language:lang,filename:'snippet.'+(lang==='python'?'py':lang)})
        });
        p.firstElementChild.style.width='90%';
        const data=await res.json();
        p.firstElementChild.style.width='100%';
        setTimeout(()=>p.style.display='none',300);
        an.classList.remove('busy');
        renderAnalysisOutput(data);
        toast('Analysis completed successfully!');
      }catch(err){
        an.classList.remove('busy');
        p.style.display='none';
        toast('Analysis error: '+err.message);
      }
    };
  }
  if(k=='history'){
    fetch('/api/history').then(r=>r.json()).then(data=>{
      const items=data.items||[];
      const c=$('#history-box');
      if(!c)return;
      if(!items.length){c.innerHTML=empty('No analyses yet. Run one and it will be listed here.');return;}
      c.innerHTML=items.map(it=>`
        <div style="padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:rgba(8,11,26,.6)">
          <div class="row sp">
            <b>${it.input_name} (${it.language})</b>
            <span class="chip c-g">${it.status}</span>
          </div>
          <div class="mut" style="font-size:12px;margin-top:6px">ID: ${it.id} · ${it.created_at} · Issues: ${it.issues_total} (Critical/High: ${it.critical_count + it.high_count})</div>
        </div>
      `).join('');
    }).catch(()=>{});
  }
  if(k=='dashboard'){
    fetch('/api/dashboard/stats').then(r=>r.json()).then(s=>{
      const db=$('#dash-stats');
      if(!db)return;
      db.innerHTML=`
        <div class="grid g4 mt" style="margin-bottom:20px">
          <div class="card"><h3>Total Analyses</h3><p style="font-size:30px;color:var(--tx);margin-top:6px">${s.total_analyses}</p></div>
          <div class="card"><h3>Completed</h3><p style="font-size:30px;color:var(--grn);margin-top:6px">${s.completed}</p></div>
          <div class="card"><h3>Total Issues</h3><p style="font-size:30px;color:var(--red);margin-top:6px">${s.total_issues}</p></div>
          <div class="card"><h3>Critical / High</h3><p style="font-size:30px;color:var(--amb);margin-top:6px">${s.critical_high}</p></div>
        </div>
      `;
    }).catch(()=>{});
  }
if(k=='github-review'){
    const smBtn=$('#gh-sample');
    if(smBtn) smBtn.onclick=()=>{
      $('#url').value='https://github.com/Srish-pathak/Technical-Specification-Analyser';
      const br=$('#gh-branch');
      if(br) br.value='main';
      toast('Sample repository URL loaded!');
    };

    an.onclick=async ()=>{
      const urlInput=$('#url');
      const url=(urlInput?urlInput.value:'').trim();
      const branchInput=$('#gh-branch');
      const branch=(branchInput?branchInput.value:'').trim();
      const tokenInput=$('#gh-token');
      const token=(tokenInput?tokenInput.value:'').trim();

      if(!url) return toast('Please enter a GitHub repository URL.');
      if(!url.includes('github.com')) return toast('Enter a valid GitHub URL (e.g. https://github.com/owner/repository)');

      if(an.classList.contains('busy')) return;
      an.classList.add('busy');

      const p=$('#pg');
      const pStatus=$('#pg-status');
      const pText=$('#pg-text');
      if(p) p.style.display='block';
      if(pStatus) pStatus.style.display='flex';

      const updateProgress=(pct, text)=>{
        if(p && p.firstElementChild) p.firstElementChild.style.width=pct+'%';
        if(pText) pText.textContent=text;
      };

      updateProgress(15, 'Validating URL & Authenticating...');

      const timer1=setTimeout(()=>updateProgress(35, 'Fetching repository metadata & file structure...'), 800);
      const timer2=setTimeout(()=>updateProgress(60, 'Downloading source files in memory for analysis...'), 2200);
      const timer3=setTimeout(()=>updateProgress(80, 'Running static code analyzers...'), 4200);
      const timer4=setTimeout(()=>updateProgress(90, 'Synthesizing architecture intelligence & review...'), 6500);

      try{
        const res=await fetch('/api/analysis/github', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            url: url,
            branch: branch || null,
            token: token || null
          })
        });

        clearTimeout(timer1);
        clearTimeout(timer2);
        clearTimeout(timer3);
        clearTimeout(timer4);

        if(!res.ok){
          const errData=await res.json().catch(()=>({detail:'HTTP error '+res.status}));
          const errMsg = (errData.error && errData.error.message) ? errData.error.message : (errData.detail || errData.message || ('GitHub Analysis failed (HTTP ' + res.status + ')'));
          throw new Error(errMsg);
        }

        updateProgress(100, 'Analysis finalized successfully!');
        const data=await res.json();

        setTimeout(()=>{
          if(p) p.style.display='none';
          if(pStatus) pStatus.style.display='none';
        }, 500);

        an.classList.remove('busy');
        renderGithubOutput(data);
        toast('GitHub repository review completed!');
      }catch(err){
        clearTimeout(timer1);
        clearTimeout(timer2);
        clearTimeout(timer3);
        clearTimeout(timer4);
        an.classList.remove('busy');
        if(p) p.style.display='none';
        if(pStatus) pStatus.style.display='none';
        toast('Error: '+err.message);
      }
    };
  }
  if(k=='pdf-analysis'){
    const dz=$('#drop-zone'), pf=$('#pf');
    const infoBar=$('#file-info-bar'), fName=$('#file-name'), fSize=$('#file-size');
    const clearBtn=$('#pdf-clear'), sampleBtn=$('#pdf-sample-btn'), hint=$('#pdf-hint');
    let selectedFile = null;

    const selectFile = (file) => {
      if(!file) return;
      if(!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
        return toast('Please select a valid PDF (.pdf) file.');
      }
      if(file.size > 20 * 1024 * 1024) {
        return toast('File exceeds the 20MB limit for PDF specifications.');
      }
      selectedFile = file;
      fName.textContent = file.name;
      fSize.textContent = (file.size < 1024*1024 ? (file.size/1024).toFixed(1) + ' KB' : (file.size/(1024*1024)).toFixed(2) + ' MB') + ' · Ready for Analysis';
      infoBar.style.display = 'flex';
      hint.textContent = 'File selected. Click "Analyze PDF" to proceed.';
      toast('Selected ' + file.name);
    };

    const clearFile = () => {
      selectedFile = null;
      pf.value = '';
      infoBar.style.display = 'none';
      hint.textContent = 'Select or drop a PDF document to begin analysis';
    };

    if(clearBtn) clearBtn.onclick = clearFile;

    if(dz) {
      dz.onclick = () => pf.click();
      ['dragenter','dragover'].forEach(v => dz.addEventListener(v, e => { e.preventDefault(); dz.style.borderColor='var(--v)'; dz.style.background='rgba(139,92,246,.12)'; }));
      ['dragleave','drop'].forEach(v => dz.addEventListener(v, e => { e.preventDefault(); dz.style.borderColor=''; dz.style.background=''; }));
      dz.addEventListener('drop', e => {
        if(e.dataTransfer.files && e.dataTransfer.files.length) {
          selectFile(e.dataTransfer.files[0]);
        }
      });
    }

    if(pf) {
      pf.onchange = e => {
        if(e.target.files && e.target.files.length) {
          selectFile(e.target.files[0]);
        }
      };
    }

    // Sample Spec Button
    if(sampleBtn) {
      sampleBtn.onclick = async () => {
        if(an.classList.contains('busy')) return;
        an.classList.add('busy');
        const p=$('#pg');
        const pStatus=$('#pg-status');
        const pText=$('#pg-text');
        if(p) p.style.display='block';
        if(pStatus) pStatus.style.display='flex';

        const updateProgress=(pct, text)=>{
          if(p && p.firstElementChild) p.firstElementChild.style.width=pct+'%';
          if(pText) pText.textContent=text;
        };

        updateProgress(15, 'Loading sample enterprise technical specification...');
        const timer1=setTimeout(()=>updateProgress(35, 'Extracting text & preserving page numbers...'), 600);
        const timer2=setTimeout(()=>updateProgress(55, 'Identifying technical specifications & requirements...'), 1400);
        const timer3=setTimeout(()=>updateProgress(75, 'Evaluating risks, architecture & missing gaps...'), 2400);
        const timer4=setTimeout(()=>updateProgress(90, 'Synthesizing AI insights & computing quality score...'), 3500);

        try {
          const res = await fetch('/api/analysis/pdf/sample', { method: 'POST' });
          clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4);
          if(!res.ok) {
            const errData = await res.json().catch(() => ({ detail: 'HTTP ' + res.status }));
            throw new Error(errData.detail || 'Sample PDF analysis failed.');
          }
          updateProgress(100, 'Analysis finalized successfully!');
          const data = await res.json();
          setTimeout(() => {
            if(p) p.style.display='none';
            if(pStatus) pStatus.style.display='none';
          }, 400);
          an.classList.remove('busy');
          renderPdfOutput(data);
          toast('Sample technical specification analyzed!');
        } catch(err) {
          clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4);
          an.classList.remove('busy');
          if(p) p.style.display='none';
          if(pStatus) pStatus.style.display='none';
          toast('Error: ' + err.message);
        }
      };
    }

    // Analyze PDF Button
    an.onclick = async () => {
      if(!selectedFile) {
        return toast('Please select or drop a PDF file first.');
      }
      if(an.classList.contains('busy')) return;
      an.classList.add('busy');

      const p=$('#pg');
      const pStatus=$('#pg-status');
      const pText=$('#pg-text');
      if(p) p.style.display='block';
      if(pStatus) pStatus.style.display='flex';

      const updateProgress=(pct, text)=>{
        if(p && p.firstElementChild) p.firstElementChild.style.width=pct+'%';
        if(pText) pText.textContent=text;
      };

      updateProgress(15, 'Uploading document...');
      const timer1=setTimeout(()=>updateProgress(35, 'Extracting text & preserving page numbers...'), 800);
      const timer2=setTimeout(()=>updateProgress(55, 'Identifying technical specifications & requirements...'), 2000);
      const timer3=setTimeout(()=>updateProgress(75, 'Evaluating risks, architecture & missing gaps...'), 3600);
      const timer4=setTimeout(()=>updateProgress(90, 'Synthesizing AI insights & computing quality score...'), 5200);

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/api/analysis/pdf', {
          method: 'POST',
          body: formData
        });
        clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4);
        if(!res.ok) {
          const errData = await res.json().catch(() => ({ detail: 'HTTP ' + res.status }));
          const errMsg = (errData.error && errData.error.message) ? errData.error.message : (errData.detail || 'Analysis failed.');
          throw new Error(errMsg);
        }
        updateProgress(100, 'Analysis finalized successfully!');
        const data = await res.json();
        setTimeout(() => {
          if(p) p.style.display='none';
          if(pStatus) pStatus.style.display='none';
        }, 400);
        an.classList.remove('busy');
        renderPdfOutput(data);
        toast('PDF specification analysis completed!');
      } catch(err) {
        clearTimeout(timer1); clearTimeout(timer2); clearTimeout(timer3); clearTimeout(timer4);
        an.classList.remove('busy');
        if(p) p.style.display='none';
        if(pStatus) pStatus.style.display='none';
        toast('Error: ' + err.message);
      }
    };
  }
  if(k=='app-settings')$('#calm').onchange=e=>{document.body.classList.toggle('calm',e.target.checked);toast(e.target.checked?'Calm mode on':'Calm mode off')};
}
function render(){const h=location.hash.slice(1);const k=V[h]?h:(h=='features'?'home':'home');const home=k=='home';
 $('#body').innerHTML=home?`<div class="view">${V.home()}</div>`:`<div class="wrap"><nav id="nav"><div class="nav-brand" style="display:flex;align-items:center;gap:10px;padding:10px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:12px"><img src="/favicon.png" width="24" height="24" style="border-radius:50%;box-shadow:0 0 12px rgba(139,92,246,.8);object-fit:cover" alt="Logo"><span style="font-weight:700;font-size:14px;color:var(--tx);letter-spacing:.3px">TechSpecAnalyser</span></div>${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==k?'on':''}">${ic(n[2])}${n[1]}</a>`).join('')}</nav><main><div class="view">${V[k]()}</div></main></div>`;
 $('#mb').style.display=home?'none':'';bind(k);if(h=='features')document.getElementById('features').scrollIntoView({behavior:'smooth'});else scrollTo(0,0)}
addEventListener('hashchange',render);
$('#mb').onclick=()=>{const n=$('#nav');n&&n.classList.toggle('open')};
document.addEventListener('click',e=>{const n=$('#nav');if(n&&n.classList.contains('open')&&!e.target.closest('nav')&&e.target.id!='mb')n.classList.remove('open')});
const P=$('#pts');for(let i=0;i<22;i++){const s=document.createElement('span');s.className='pt';s.style.cssText=`--s:${1.5+Math.random()*2.5}px;--x:${Math.random()*100}%;--y:${Math.random()*100}%;--d:${14+Math.random()*20}s;--dl:-${Math.random()*20}s;--mx:${(Math.random()-.5)*200}px;--my:${(Math.random()-.5)*200}px`;P.appendChild(s)}
render();
</script>
