<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="spaceDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#040612" />
      <stop offset="100%" stop-color="#080B1A" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep space background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#spaceDark)" />

  <!-- Outer ambient glow ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="26" opacity="0.3" filter="url(#glow)" />

  <!-- Main glowing gradient ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="22" filter="url(#glow)" />

  <!-- Inner core singularity -->
  <circle cx="64" cy="64" r="30" fill="#060814" />
</svg>
